<div class="register-container">
  <div class="register-form">
    <h1>Create account</h1>
    <p class="subtitle">Sign up to get started with Rosenbridge</p>

    <mat-form-field appearance="outline">
      <mat-label>Username</mat-label>
      <input matInput />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput [type]="passwordVisible ? 'text' : 'password'" />
      <button mat-icon-button matSuffix (click)="passwordVisible = !passwordVisible" type="button">
        <mat-icon>{{ passwordVisible ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Repeat password</mat-label>
      <input matInput [type]="repeatPasswordVisible ? 'text' : 'password'" />
      <button mat-icon-button matSuffix (click)="repeatPasswordVisible = !repeatPasswordVisible" type="button">
        <mat-icon>{{ repeatPasswordVisible ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    <button mat-flat-button class="register-button">Register</button>

    <p class="login-link">Already have an account? <a routerLink="/login">Login</a></p>
  </div>
</div>
